---
# Sample: creates a marker file (harmless write) - proves the deployer can
# run tasks that make changes on the target.
- name: Sample - Marker
  hosts: all
  tasks:
    - name: Write deploy marker
      copy:
        content: "deployed by ansible-deployer at {{ ansible_date_time.iso8601 }}\n"
        dest: /tmp/ansible_deployer_sample_marker.txt
        mode: "0644"

    - name: Confirm marker
      debug:
        msg: "Marker written to /tmp/ansible_deployer_sample_marker.txt"
