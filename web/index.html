<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ansible Deployer</title>
<style>
:root {
  --bg: #0d1117; --panel: #161b22; --panel2: #1c2330;
  --border: #30363d; --text: #e6edf3; --dim: #8b949e;
  --accent: #2ea043; --accent-hi: #3fb950; --warn: #d29922; --err: #f85149;
  --blue: #58a6ff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 20px;
  background: var(--panel); border-bottom: 1px solid var(--border); }
header h1 { font-size: 16px; margin: 0; letter-spacing: .5px; }
header h1 span { color: var(--accent-hi); }
header .sub { color: var(--dim); font-size: 12px; }
main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  padding: 16px 20px; max-width: 1600px; margin: 0 auto; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; overflow: hidden; }
.panel h2 { margin: 0; padding: 10px 14px; font-size: 13px;
  text-transform: uppercase; letter-spacing: 1px; color: var(--dim);
  background: var(--panel2); border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center; }
.panel .body { padding: 12px 14px; }
label { display: block; color: var(--dim); font-size: 12px; margin: 8px 0 3px; }
input, select { width: 100%; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px;
  font: inherit; }
input:focus { outline: 1px solid var(--accent); }
.row { display: flex; gap: 10px; } .row > div { flex: 1; }
button { background: var(--accent); color: #fff; border: 0; border-radius: 6px;
  padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
button:hover { background: var(--accent-hi); }
button:disabled { background: #30363d; color: var(--dim); cursor: not-allowed; }
button.ghost { background: transparent; color: var(--blue);
  border: 1px solid var(--border); font-weight: 400; padding: 6px 12px; }
button.ghost:hover { background: #1f2937; }
button.danger { background: var(--err); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #21262d; }
th { color: var(--dim); font-size: 11px; text-transform: uppercase; position: sticky; top: 0; background: var(--panel); }
.tblwrap { max-height: 320px; overflow: auto; }
tr.sel td { background: #1a2e1f; }
.hostip { color: var(--blue); }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px;
  font-size: 11px; border: 1px solid var(--border); }
.badge.playbook { color: var(--accent-hi); border-color: var(--accent); }
.badge.task { color: var(--warn); border-color: var(--warn); }
.badge.other { color: var(--dim); }
.badge.success { color: #fff; background: var(--accent); border-color: var(--accent); }
.badge.error { color: #fff; background: var(--err); border-color: var(--err); }
.badge.running { color: #fff; background: var(--blue); border-color: var(--blue); animation: pulse 1.5s infinite; }
.badge.queued, .badge.cancelled { color: var(--dim); }
@keyframes pulse { 50% { opacity: .55; } }
.play { display: flex; align-items: center; gap: 8px; padding: 7px 8px;
  border-radius: 6px; cursor: pointer; }
.play:hover { background: var(--panel2); }
.play input { width: auto; }
.play .pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.play .pid { color: var(--dim); font-size: 12px; }
.logpanel { grid-column: 1 / -1; }
.log { background: #010409; border-radius: 6px; padding: 12px; min-height: 200px;
  max-height: 420px; overflow: auto; white-space: pre-wrap; word-break: break-word;
  font-size: 12.5px; }
.log .err { color: var(--err); } .log .ok { color: var(--accent-hi); }
.hidden { display: none; }
.muted { color: var(--dim); font-size: 12px; }
.deploybar { display: flex; gap: 12px; align-items: center; padding: 14px;
  border-top: 1px solid var(--border); background: var(--panel2); }
.counts { color: var(--dim); font-size: 12px; }
.spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--dim);
  border-top-color: var(--accent-hi); border-radius: 50%; animation: spin .8s linear infinite;
  vertical-align: -1px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>ANSIBLE<span> DEPLOYER</span></h1>
  <div class="sub">pick hosts → pick playbook → run</div>
</header>
<main>
  <div class="col">
    <!-- Hosts -->
    <div class="panel">
      <h2>Network hosts
        <button class="ghost" id="btn-scan">⟳ Scan</button>
      </h2>
      <div class="body">
        <div class="row">
          <div>
            <label>Subnets (comma-separated)</label>
            <input id="subnets" value="">
          </div>
          <div style="flex:0 0 90px">
            <label>SSH port</label>
            <input id="scan-port" type="number" value="22">
          </div>
        </div>
        <div id="scan-status" class="muted" style="margin-top:8px"></div>
        <div class="tblwrap">
          <table>
            <thead><tr>
              <th style="width:30px"><input type="checkbox" id="sel-all" title="select all"></th>
              <th>IP</th><th>SSH banner</th>
            </tr></thead>
            <tbody id="host-rows"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Credentials -->
    <div class="panel">
      <h2>Credentials</h2>
      <div class="body">
        <p class="muted">Defaults come from the kickstart baseline. Leave
          password empty to use SSH key auth (<code>~/.ssh/id_ed25519</code>)
          on this server.</p>
        <div class="row">
          <div>
            <label>SSH user</label>
            <input id="cred-user" autocomplete="off">
          </div>
          <div style="flex:0 0 90px">
            <label>Port</label>
            <input id="cred-port" type="number" value="22">
          </div>
        </div>
        <label>Password (blank = key auth)</label>
        <input id="cred-pass" type="password" autocomplete="off">
        <label>Sudo password (if it differs from the SSH password)</label>
        <input id="cred-sudo" type="password" autocomplete="off">
      </div>
    </div>
  </div>

  <div class="col">
    <!-- Playbooks -->
    <div class="panel">
      <h2>Playbooks &amp; tasks
        <button class="ghost" id="btn-refresh-pb">⟳ Refresh</button>
      </h2>
      <div class="body">
        <input id="pb-filter" placeholder="filter by name / STIG id…">
        <div id="pb-list" style="max-height:380px; overflow:auto; margin-top:8px"></div>
        <p id="pb-hint" class="muted" style="margin-top:8px"></p>
      </div>
    </div>
  </div>

  <!-- Job log -->
  <div class="panel logpanel hidden" id="job-panel">
    <h2>Deployment <span id="job-id"></span>
      <span>
        <span id="job-status" class="badge running">queued</span>
        <button class="ghost" id="btn-close-job" style="margin-left:12px">Close</button>
      </span>
    </h2>
    <div class="body">
      <div id="job-meta" class="muted" style="margin-bottom:8px"></div>
      <div class="log" id="job-log"></div>
      <div style="margin-top:10px">
        <button class="ghost" id="btn-cancel">Stop job</button>
      </div>
    </div>
  </div>

  <div class="panel" style="grid-column:1/-1">
    <div class="deploybar">
      <span class="counts" id="sel-counts"></span>
      <div style="flex:1"></div>
      <button id="btn-deploy" disabled>▶ Deploy</button>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let HOSTS = [];          // [{ip, banner, checked}]
let PLAYBOOKS = [];      // [{id, path, type, plays, source_dir, ...}]
let curJob = null, pollTimer = null;

async function api(path, opts = {}) {
  const r = await fetch(path, Object.assign({headers: {"Content-Type": "application/json"}}, opts));
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}

// ---- config / defaults ----------------------------------------------------
(async () => {
  try {
    const c = await api("/api/config");
    $("subnets").value = c.scan_subnets.join(", ");
    $("cred-user").value = c.default_creds.user || "";
    $("cred-pass").value = c.default_creds.password || "";
    $("cred-sudo").value = c.default_creds.sudo_password || "";
    updateCounts();
  } catch (e) { console.error(e); }
})();

// ---- hosts ----------------------------------------------------------------
$("btn-scan").onclick = async () => {
  const subnets = $("subnets").value.split(",").map(s => s.trim()).filter(Boolean);
  if (!subnets.length) return;
  const port = +$("scan-port").value || 22;
  $("btn-scan").disabled = true;
  $("scan-status").innerHTML = '<span class="spinner"></span>scanning ' + subnets.join(", ") + " …";
  try {
    const data = await api("/api/scan", {method: "POST",
      body: JSON.stringify({subnets, port})});
    HOSTS = data.hosts.map(h => ({...h, checked: false}));
    renderHosts();
    $("scan-status").textContent = data.hosts.length + " host(s) responding on port " + port;
  } catch (e) {
    $("scan-status").textContent = "scan failed: " + e.message;
  }
  $("btn-scan").disabled = false;
};

function renderHosts() {
  const tb = $("host-rows");
  tb.innerHTML = "";
  HOSTS.forEach((h, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = '<td><input type="checkbox" data-i="' + i + '"></td>' +
      '<td class="hostip">' + h.ip + '</td><td class="muted">' +
      (h.ssh_banner || "").slice(0, 60) + '</td>';
    tr.querySelector("input").onchange = e => { h.checked = e.target.checked;
      tr.classList.toggle("sel", h.checked); updateCounts(); };
    tb.appendChild(tr);
  });
  $("sel-all").checked = false;
  updateCounts();
}
$("sel-all").onchange = e => {
  HOSTS.forEach(h => h.checked = e.target.checked);
  renderHosts();
};

// ---- playbooks ------------------------------------------------------------
async function loadPlaybooks() {
  try {
    const data = await api("/api/playbooks");
    PLAYBOOKS = data.playbooks;
    renderPlaybooks();
  } catch (e) { $("pb-hint").textContent = "failed: " + e.message; }
}
function renderPlaybooks() {
  const q = $("pb-filter").value.toLowerCase();
  const el = $("pb-list");
  el.innerHTML = "";
  let shown = 0;
  PLAYBOOKS.forEach((p, i) => {
    if (q && !((p.id + " " + (p.stig_ids || []).join(" ") + " " +
        (p.plays || []).map(x => x.name).join(" ")).toLowerCase().includes(q))) return;
    shown++;
    const div = document.createElement("label");
    div.className = "play";
    const title = p.type === "playbook" && p.plays[0] ? p.plays[0].name : p.id;
    div.innerHTML = '<input type="radio" name="pb" value="' + i + '">' +
      '<span class="badge ' + p.type + '">' + p.type + '</span>' +
      '<span class="pname" title="' + p.path + '">' + esc(title) + '</span>' +
      '<span class="pid">' + p.source_dir.replace(/^\/opt\//, "") + '</span>';
    el.appendChild(div);
  });
  $("pb-hint").textContent = shown + " of " + PLAYBOOKS.length + " playbook(s)/task file(s) on this server";
}
$("pb-filter").oninput = renderPlaybooks;
$("btn-refresh-pb").onclick = loadPlaybooks;
function esc(s) { const d = document.createElement("i"); d.textContent = s; return d.innerHTML; }

// ---- deploy ---------------------------------------------------------------
function selHosts() { return HOSTS.filter(h => h.checked).map(h => h.ip); }
function selPb() {
  const r = document.querySelector('input[name="pb"]:checked');
  return r ? PLAYBOOKS[+r.value] : null;
}
document.body.addEventListener("change", updateCounts);
["cred-user", "cred-port", "cred-pass", "cred-sudo"].forEach(id =>
  $(id).addEventListener("input", updateCounts));
function updateCounts() {
  const h = selHosts().length, p = selPb() ? 1 : 0;
  $("sel-counts").textContent = h + " host(s) · " + p + " playbook";
  $("btn-deploy").disabled = !(h && p && $("cred-user").value.trim());
}

$("btn-deploy").onclick = async () => {
  const pb = selPb();
  const creds = {
    user: $("cred-user").value.trim(),
    port: +$("cred-port").value || 22,
    password: $("cred-pass").value,
    sudo_password: $("cred-sudo").value
  };
  $("btn-deploy").disabled = true;
  try {
    const job = await api("/api/deploy", {method: "POST", body: JSON.stringify({
      hosts: selHosts(), creds, target: pb.path})});
    openJob(job.id);
  } catch (e) {
    alert("deploy failed: " + e.message);
    $("btn-deploy").disabled = false;
  }
};

// ---- job tracking ---------------------------------------------------------
async function openJob(id) {
  curJob = {id, offset: 0};
  $("job-panel").classList.remove("hidden");
  $("job-id").textContent = "#" + id;
  $("job-log").textContent = "";
  stopPoll();
  poll();
}
async function poll() {
  stopPoll();
  try {
    const j = await api("/api/jobs/" + curJob.id);
    $("job-meta").textContent =
      j.hosts.join(", ") + " · " + j.target + " · user " + j.user + " · " + j.auth + " auth";
    const st = $("job-status");
    st.textContent = j.status; st.className = "badge " + j.status;
    const log = await api("/api/jobs/" + curJob.id + "/log?offset=" + curJob.offset);
    const el = $("job-log");
    el.textContent += log.log;
    el.scrollTop = el.scrollHeight;
    curJob.offset = log.offset;
    if (j.status === "running" || j.status === "queued") pollTimer = setTimeout(poll, 1500);
    else {
      const rest = await api("/api/jobs/" + curJob.id + "/log?offset=" + curJob.offset);
      if (rest.log) { el.textContent += rest.log; el.scrollTop = el.scrollHeight; }
      $("btn-cancel").style.visibility = "hidden";
      $("btn-deploy").disabled = false;
    }
  } catch (e) { console.error(e); }
}
function stopPoll() { if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; } }

$("btn-cancel").onclick = async () => {
  if (curJob) await api("/api/jobs/" + curJob.id + "/cancel", {method: "POST"});
};
$("btn-close-job").onclick = () => {
  stopPoll(); curJob = null;
  $("job-panel").classList.add("hidden");
};

loadPlaybooks();
updateCounts();
</script>
</body>
</html>
